services:
  db:
    image: postgres:16-alpine
    container_name: techmanion_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_dev
    ports:
      # host 5433 -> container 5432 (avoids clashing with local Homebrew Postgres on 5432)
      - "5433:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal_pgdata:
